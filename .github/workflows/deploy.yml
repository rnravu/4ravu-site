# Deploys 4ravu.com to app-server using a blue-green slot switch.
#
# Connects over Tailscale (tag:ci-deploy) to App's stable Tailscale IP
# 100.89.205.98, instead of the public internet. Validated by the one-off
# connectivity pilot in tailscale-ssh-pilot.yml before this migration; see
# docs/deploy-setup.md for the full history and troubleshooting.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   TS_OAUTH_CLIENT_ID     - Tailscale OAuth client ID (tag:ci-deploy only,
#                             App TCP/22 access)
#   TS_OAUTH_CLIENT_SECRET - Tailscale OAuth client secret
#   SSH_USER               - deploy
#   SSH_PRIVATE_KEY        - private half of the dedicated keypair registered
#                             in deploy's ~/.ssh/authorized_keys on App
#                             (do not reuse the wood-stone gh-actions-deploy
#                             key, and do not reuse the separate pilot key
#                             that validated Tailscale connectivity)
#
# App's SSH host key is pinned inline below (verified directly from
# /etc/ssh/ssh_host_ed25519_key.pub on App over an already-trusted session,
# not ssh-keyscan). The SSH_HOST / SSH_KNOWN_HOSTS secrets from the previous
# public-IP transport are no longer used by this workflow.
#
# All deploy logic, including health checks and rollback-on-failure, lives
# in server/4ravu-deploy.sh on the server; this workflow only rsyncs content
# over and triggers it.

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_HOST: 100.89.205.98

jobs:
  deploy:
    name: Deploy to app-server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci-deploy
          version: 1.94.2

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat > ~/.ssh/known_hosts <<'EOF'
          100.89.205.98 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJzusykxBmZqpcZ0mHWqh5QOvS0g7c8FQOVHk/DC6pXW
          EOF
          chmod 600 ~/.ssh/known_hosts

      - name: Sync site content to the incoming staging directory
        run: |
          rsync -av --delete \
            -e "ssh -F /dev/null -o StrictHostKeyChecking=yes -o BatchMode=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 -i $HOME/.ssh/deploy_key" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "server" \
            --exclude "Caddyfile" \
            ./ "${{ secrets.SSH_USER }}@${{ env.APP_HOST }}:/opt/4ravu-site/incoming/"

      - name: Sync internal Caddyfile
        run: |
          rsync -av \
            -e "ssh -F /dev/null -o StrictHostKeyChecking=yes -o BatchMode=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 -i $HOME/.ssh/deploy_key" \
            ./Caddyfile "${{ secrets.SSH_USER }}@${{ env.APP_HOST }}:/opt/4ravu-site/Caddyfile"

      - name: Run blue-green deploy on the server
        run: |
          ssh -F /dev/null \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USER }}@${{ env.APP_HOST }}" \
            "bash /opt/4ravu-site/4ravu-deploy.sh"
