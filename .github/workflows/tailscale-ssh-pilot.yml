# Manual-only pilot: verifies GitHub Actions can reach App over Tailscale SSH
# using a dedicated, forced-command-restricted pilot key. This workflow does
# NOT deploy anything and is fully separate from deploy.yml / its secrets.
#
# Required repository secrets:
#   TS_OAUTH_CLIENT_ID      - Tailscale OAuth client ID (tag:ci-deploy only)
#   TS_OAUTH_CLIENT_SECRET  - Tailscale OAuth client secret
#   PILOT_SSH_PRIVATE_KEY   - private half of the dedicated pilot keypair
#                              registered in deploy's ~/.ssh/authorized_keys
#                              on App with a forced command and restrict flag
#                              (does not replace or touch the existing
#                              deploy/github-actions-* keys)
#
# App's SSH host key is pinned below (fetched via an already-trusted SSH
# session directly from /etc/ssh/ssh_host_ed25519_key.pub on App, not via
# a blind ssh-keyscan or accept-new TOFU).
#
# This workflow only runs a fixed forced command on App and asserts its
# output. It performs no rsync, deployment, Podman, or Caddy actions.

name: Tailscale SSH Pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tailscale-ssh-pilot
  cancel-in-progress: false

jobs:
  pilot:
    name: Tailscale SSH connectivity check
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci-deploy
          version: 1.94.2

      - name: Stage pilot key and pinned host key
        env:
          PILOT_SSH_PRIVATE_KEY: ${{ secrets.PILOT_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$PILOT_SSH_PRIVATE_KEY" > "$HOME/.ssh/pilot_key"
          chmod 600 "$HOME/.ssh/pilot_key"

          cat > "$HOME/.ssh/pilot_known_hosts" <<'EOF'
          100.89.205.98 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJzusykxBmZqpcZ0mHWqh5QOvS0g7c8FQOVHk/DC6pXW
          EOF
          chmod 600 "$HOME/.ssh/pilot_known_hosts"

      - name: Run pilot connectivity check over Tailscale SSH
        run: |
          set -uo pipefail
          OUTPUT=$(ssh \
            -F /dev/null \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o UserKnownHostsFile="$HOME/.ssh/pilot_known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 \
            -i "$HOME/.ssh/pilot_key" \
            deploy@100.89.205.98)
          SSH_STATUS=$?

          echo "Remote output: $OUTPUT"

          if [ "$SSH_STATUS" -ne 0 ]; then
            echo "::error::ssh exited with status $SSH_STATUS"
            exit "$SSH_STATUS"
          fi
          if [ "$OUTPUT" != "TAILSCALE_SSH_PILOT_OK" ]; then
            echo "::error::Unexpected output from pilot connectivity check: $OUTPUT"
            exit 1
          fi
          echo "Pilot connectivity check succeeded."

      - name: Clean up pilot key material
        if: always()
        run: |
          shred -u "$HOME/.ssh/pilot_key" 2>/dev/null || rm -f "$HOME/.ssh/pilot_key"
          rm -f "$HOME/.ssh/pilot_known_hosts"
